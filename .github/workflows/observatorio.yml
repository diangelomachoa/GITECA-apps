name: Observatorio Amazonia (datos diarios)

on:
  schedule:
    - cron: "15 11 * * *"   # 06:15 hora de Peru
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatorio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y procesar datos
        run: python scripts/observatorio_amazonia.py
      - name: Guardar cambios
        run: |
          git config user.name "GITECA bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/datos/*.json
          git diff --cached --quiet || git commit -m "Observatorio: datos del $(date -u +%F)"
          git pull --rebase
          git push
